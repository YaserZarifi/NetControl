name: Windows installer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Resolve dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install; Write-Warning 'Bootstrap build: commit the generated package-lock.json before release.' }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path src-tauri/Cargo.lock)) { cargo generate-lockfile --manifest-path src-tauri/Cargo.toml; Write-Warning 'Bootstrap build: commit the generated Cargo.lock before release.' }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate application icons
        run: node scripts/create-icons.mjs
      - name: Check TypeScript and lint
        run: npm run check
      - name: Format Rust and preserve source patch
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --binary -- src-tauri > rustfmt.patch
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Build frontend for Rust context
        run: npm run build
      - name: Check Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test persistence and preferences
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -- --include-ignored --test-threads=1
      - name: Package Windows x64 NSIS installer
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - name: Verify installed application startup and collection
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $installDirectory = Join-Path $env:RUNNER_TEMP 'NetControl-smoke'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDirectory" -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $executable = Join-Path $installDirectory 'NetControl.exe'
          if (!(Test-Path $executable)) { $executable = Join-Path $installDirectory 'netcontrol.exe' }
          $process = Start-Process -FilePath $executable -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
          if (!$process.WaitForExit(60000)) { Stop-Process -Id $process.Id -Force; throw 'Installed app did not finish its startup check' }
          if ($process.ExitCode -ne 0) { throw "Installed app check failed: $($process.ExitCode)" }
          $report = Join-Path $env:LOCALAPPDATA 'com.netcontrol.desktop/netcontrol-smoke.json'
          Copy-Item $report installed-app-smoke.json
          Get-Content installed-app-smoke.json
          $uninstaller = Get-ChildItem $installDirectory/*uninstall*.exe | Select-Object -First 1
          if (!$uninstaller) { throw 'Uninstaller was not found' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru -WindowStyle Hidden
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed: $($uninstall.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: NetControl-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Preserve dependency locks and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            installed-app-smoke.json
            rustfmt.patch
            package-lock.json
            src-tauri/Cargo.lock
            src-tauri/target/**/build/netcontrol-*/output
          if-no-files-found: warn
