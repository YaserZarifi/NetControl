name: Windows installer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Resolve dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install; Write-Warning 'Bootstrap build: commit the generated package-lock.json before release.' }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path src-tauri/Cargo.lock)) { cargo generate-lockfile --manifest-path src-tauri/Cargo.toml; Write-Warning 'Bootstrap build: commit the generated Cargo.lock before release.' }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate application icons
        run: node scripts/create-icons.mjs
      - name: Check TypeScript and lint
        run: npm run check
      - name: Format Rust and preserve source patch
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --binary -- src-tauri > rustfmt.patch
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Build frontend for Rust context
        run: npm run build
      - name: Check Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test persistence and preferences
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -- --include-ignored --test-threads=1
      - name: Package Windows x64 NSIS installer
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: NetControl-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Preserve dependency locks and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            rustfmt.patch
            package-lock.json
            src-tauri/Cargo.lock
            src-tauri/target/**/build/netcontrol-*/output
          if-no-files-found: warn
