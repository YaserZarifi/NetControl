name: Bug report
description: Report a reproducible problem in NetControl.
body:
  - type: input
    id: version
    attributes:
      label: NetControl version
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11, version and build number
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include what you expected and what happened. Remove private information.
    validations:
      required: true
