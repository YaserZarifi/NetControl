[package]
name = "netcontrol"
version = "0.1.0"
description = "Local Windows network usage monitor"
edition = "2021"
license = "MIT"

[lib]
name = "netcontrol_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }

chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
winreg = "0.55"
ferrisetw = "1.2"
tauri-plugin-single-instance = "2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Com", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_NetworkManagement_WindowsFirewall"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
